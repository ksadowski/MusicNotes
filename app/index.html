<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MusicNotes</title>
<meta name="description" content="Szybkie zapisywanie formy piosenek: sekcje, akordy, powtórzenia, tryb sceniczny. Działa offline.">
<meta name="theme-color" content="#F6F7F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171A1F" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sb-head">
      <div class="brand">
        <svg viewBox="0 0 34 34" aria-hidden="true"><g stroke="currentColor" stroke-width="1.3" opacity=".35"><path d="M1 7h32M1 12h32M1 17h32M1 22h32M1 27h32"/></g><rect x="3" y="9" width="8" height="16" rx="2.5" fill="currentColor"/><rect x="13" y="5" width="6" height="24" rx="2.5" fill="currentColor" opacity=".65"/><rect x="21" y="9" width="10" height="16" rx="2.5" fill="currentColor"/></svg>
        <div><h1>MusicNotes</h1><small>Formy piosenek</small></div>
      </div>
      <button class="btn primary" data-act="new-song">+ Nowa piosenka</button>
      <input class="search" id="f-search" data-field="search" type="search" placeholder="Szukaj piosenki" aria-label="Szukaj piosenki">
    </div>
    <ul id="songList"></ul>
    <div class="sb-foot" id="sbFoot"></div>
  </aside>
  <main class="main" id="main"><div id="editor"></div></main>
</div>
<div class="layer" id="keypad" hidden></div>
<div class="layer" id="textSheet" hidden></div>
<div class="stage" id="stage" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>
</body>
</html>
