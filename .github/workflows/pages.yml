# Publikuje folder app/ na GitHub Pages przy każdym pushu na main.
# W repozytorium: Settings → Pages → Source: „GitHub Actions”.
name: Publikacja na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Wersja service workera = skrót commita
        run: sed -i "s/__BUILD__/${GITHUB_SHA::8}/" app/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
